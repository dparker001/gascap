name: GasCap Cron Jobs

on:
  schedule:
    - cron: '50 23 * * *'  # giveaway-draw         (23:50 UTC / 7:50 PM ET — no-ops except the last UTC day of the month)
    - cron: '0 11 * * *'   # integrity-check       (11:00 UTC / 7:00 AM ET)
    - cron: '0 12 * * *'   # engagement-campaign  (12:00 UTC)
    - cron: '0 13 * * *'   # trial-expire          (13:00 UTC)
    - cron: '0 14 * * *'   # email-campaign        (14:00 UTC)
    - cron: '0 15 * * *'   # verify-reminder       (15:00 UTC)
    - cron: '30 15 * * *'  # paid-campaign         (15:30 UTC)
    - cron: '0 16 * * *'   # comp-campaign         (16:00 UTC)
    - cron: '30 16 * * *'  # winback               (16:30 UTC / 12:30 PM ET)
    - cron: '30 17 * * *'  # first-fillup-nudge    (17:30 UTC / 1:30 PM ET)
    - cron: '0 18 * * *'   # fillup-reminder       (18:00 UTC)
    - cron: '0 19 * * *'   # getaway-reminder      (19:00 UTC / 3:00 PM ET)
    - cron: '0 20 * * *'   # price-alerts          (20:00 UTC)
    - cron: '5 * * * *'    # rental-return-reminder (hourly — pickup 24h/2h tiers + return check; each tier dedups via its own column)
    - cron: '0 23 * * *'   # streak-reminder       (23:00 UTC / 7 PM ET)
    - cron: '0 17 * * 1'   # digest                (17:00 UTC, Mondays only)
    - cron: '0 21 * * *'   # cleanup-rate-limits   (21:00 UTC — deletes expired RateLimitCounter rows)
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Endpoint to run manually'
        required: true
        type: choice
        options:
          - giveaway-draw
          - integrity-check
          - engagement-campaign
          - trial-expire
          - email-campaign
          - verify-reminder
          - paid-campaign
          - comp-campaign
          - winback
          - first-fillup-nudge
          - fillup-reminder
          - getaway-reminder
          - price-alerts
          - rental-return-reminder
          - streak-reminder
          - digest
          - cleanup-rate-limits

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve endpoint
        id: resolve
        run: |
          case "${{ github.event.schedule }}" in
            "50 23 * * *") echo "endpoint=giveaway-draw"       >> "$GITHUB_OUTPUT" ;;
            "0 11 * * *")  echo "endpoint=integrity-check"     >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *")  echo "endpoint=engagement-campaign" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * *")  echo "endpoint=trial-expire"        >> "$GITHUB_OUTPUT" ;;
            "0 14 * * *")  echo "endpoint=email-campaign"      >> "$GITHUB_OUTPUT" ;;
            "0 15 * * *")  echo "endpoint=verify-reminder"     >> "$GITHUB_OUTPUT" ;;
            "30 15 * * *") echo "endpoint=paid-campaign"       >> "$GITHUB_OUTPUT" ;;
            "0 16 * * *")  echo "endpoint=comp-campaign"       >> "$GITHUB_OUTPUT" ;;
            "30 16 * * *") echo "endpoint=winback"             >> "$GITHUB_OUTPUT" ;;
            "30 17 * * *") echo "endpoint=first-fillup-nudge" >> "$GITHUB_OUTPUT" ;;
            "0 18 * * *")  echo "endpoint=fillup-reminder"     >> "$GITHUB_OUTPUT" ;;
            "0 19 * * *")  echo "endpoint=getaway-reminder"    >> "$GITHUB_OUTPUT" ;;
            "0 20 * * *")  echo "endpoint=price-alerts"        >> "$GITHUB_OUTPUT" ;;
            "5 * * * *")   echo "endpoint=rental-return-reminder" >> "$GITHUB_OUTPUT" ;;
            "0 23 * * *")  echo "endpoint=streak-reminder"     >> "$GITHUB_OUTPUT" ;;
            "0 17 * * 1")  echo "endpoint=digest"              >> "$GITHUB_OUTPUT" ;;
            "0 21 * * *")  echo "endpoint=cleanup-rate-limits" >> "$GITHUB_OUTPUT" ;;
            *)             echo "endpoint=${{ inputs.endpoint }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Call cron endpoint
        run: |
          ENDPOINT="${{ steps.resolve.outputs.endpoint }}"
          echo "Running: /api/cron/$ENDPOINT"
          curl -sf --max-time 30 \
            "https://www.gascap.app/api/cron/$ENDPOINT?secret=${{ secrets.CRON_SECRET }}"
          echo "✓ $ENDPOINT completed successfully"
